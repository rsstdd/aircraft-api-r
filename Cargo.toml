[workspace]
resolver = "3"
members = [
#    "apps/server",
#    "crates/aircraft_api",
#    "crates/aircraft_app",
#    "crates/aircraft_config",
#    "crates/aircraft_db",
#    "crates/aircraft_domain",
#    "crates/aircraft_ingest",
#    "crates/aircraft_observability",
    "xtask",
]
default-members = [
#    "apps/server",
#    "crates/aircraft_api",
#    "crates/aircraft_app",
#    "crates/aircraft_config",
#    "crates/aircraft_db",
#    "crates/aircraft_domain",
#    "crates/aircraft_ingest",
#    "crates/aircraft_observability",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Internal workspace crates
aircraft_api = { path = "crates/aircraft_api" }
aircraft_app = { path = "crates/aircraft_app" }
aircraft_config = { path = "crates/aircraft_config" }
aircraft_db = { path = "crates/aircraft_db" }
aircraft_domain = { path = "crates/aircraft_domain" }
aircraft_ingest = { path = "crates/aircraft_ingest" }
aircraft_observability = { path = "crates/aircraft_observability" }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async runtime & HTTP networking infrastructure
tokio = { version = "1.40", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "timeout", "limit", "request-id"] }
hyper = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration layers
config = "0.15"
dotenvy = "0.15"

# Database Engine (SQLx Async Blueprint Replacement)
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "bigdecimal", "macros"] }

# Secret Hygiene & Memory Defenses
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }

# API Contract Discovery & Documentation
utoipa = { version = "5.0", features = ["axum"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

# Core Domain Data Primitives
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["serde", "v4"] }

# Structured Diagnostic Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-error = "0.2"

# Perimeter Invariant Validation
validator = { version = "0.20", features = ["derive"] }

# Testing Infrastructure & Verification Engines
pretty_assertions = "1.4"
testcontainers = "0.27.3"
insta = { version = "1.40", features = ["json"] }
proptest = "1.5"
serial_test = "3.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_imports = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -3 }
pedantic = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -2 }

unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
debug = true
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.test]
debug = true