[package]
name = "aircraft_server"
version = "0.1.0"
edition = "2018"
description = "Aircraft Server"

[lib]
doctest = false

[profile.dev]
debug = 0

[workspace]
members = [
  "crates/api_common",
  "crates/api_crud",
  "crates/db_schema",
  "crates/routes",
  "crates/utils",
  "crates/websocket",
]

[dependencies]
aircraft_api = { version = "=0.1.0", path = "./crates/api" }
aircraft_api_common = { version = "=0.1.0", path = "./crates/api_common" }
aircraft_api_crud = { version = "=0.1.0", path = "./crates/api_crud" }
aircraft_db_schema = { version = "=0.1.0", path = "./crates/db_schema" }
aircraft_routes = { version = "=0.1.0", path = "./crates/routes" }
aircraft_utils = { version = "=0.1.0", path = "./crates/utils" }
aircraft_websocket = { version = "=0.1.0", path = "./crates/websocket" }
diesel = "1.4.8"
diesel_migrations = "1.4.0"
chrono = { version = "0.4.19", features = ["serde"] }
serde = { version = "1.0.130", features = ["derive"] }
actix = "0.12.0"
actix-web = { version = "4.0.0-beta.9", default-features = false, features = ["rustls"] }
tracing = "0.1.29"
tracing-actix-web = "0.5.0-beta.2"
tracing-error = "0.2.0"
tracing-log = "0.1.2"
tracing-subscriber = { version = "0.3.2", features = ["env-filter"] }
strum = "0.21.0"
url = { version = "2.2.2", features = ["serde"] }
openssl = "0.10.36"
http-signature-normalization-actix = { version = "0.5.0-beta.10", default-features = false, features = ["sha-2"] }
tokio = { version = "1.12.0", features = ["sync"] }
anyhow = "1.0.44"
reqwest = { version = "0.11.4", features = ["json"] }
activitystreams = "0.7.0-alpha.11"
actix-rt = { version = "2.2.0", default-features = false }
serde_json = { version = "1.0.68", features = ["preserve_order"] }
clokwerk = "0.3.5"
doku = "0.10.1"

[dev-dependencies.cargo-husky]
version = "1.5.0"
default-features = false # Disable features which are enabled by default
features = ["user-hooks"]

[package.metadata.cargo-udeps.ignore]
development = ["cargo-husky"]
