[workspace]
resolver = "3"
members = [
    "apps/ingest",
# apps/server stays excluded: its source still depends on retired
# Actix/Diesel-era crates and does not build in this workspace.
#    "apps/server",
    "crates/aircraft_api",
    "crates/aircraft_app",
    "crates/aircraft_config",
    "crates/aircraft_db",
    "crates/aircraft_domain",
    "crates/aircraft_ingest",
    "crates/aircraft_observability",
    "crates/aircraft_testsupport",
    "xtask",
]
default-members = [
    "apps/ingest",
    "crates/aircraft_api",
    "crates/aircraft_app",
    "crates/aircraft_config",
    "crates/aircraft_db",
    "crates/aircraft_domain",
    "crates/aircraft_ingest",
    "crates/aircraft_observability",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Internal workspace crates
aircraft_api = { path = "crates/aircraft_api" }
aircraft_app = { path = "crates/aircraft_app" }
aircraft_config = { path = "crates/aircraft_config" }
aircraft_db = { path = "crates/aircraft_db" }
aircraft_domain = { path = "crates/aircraft_domain" }
aircraft_ingest = { path = "crates/aircraft_ingest" }
aircraft_observability = { path = "crates/aircraft_observability" }
aircraft_testsupport = { path = "crates/aircraft_testsupport" }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async runtime & HTTP networking infrastructure
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "timeout", "limit", "request-id"] }
hyper = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration layers
config = { version = "0.15", default-features = false, features = ["json5"] }
dotenvy = "0.15"

# Database Engine (SQLx Async Blueprint Replacement)
sqlx-core = { version = "=0.8.6", features = ["_rt-tokio", "_tls-rustls-ring-webpki", "chrono", "uuid", "bigdecimal", "json"] }
sqlx-postgres = { version = "=0.8.6", features = ["chrono", "uuid", "bigdecimal", "json"] }

# Secret Hygiene & Memory Defenses
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }

# API Contract Discovery & Documentation
utoipa = "5.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

# Core Domain Data Primitives
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["serde", "v4"] }

# Structured Diagnostic Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-error = "0.2"
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry-otlp = "0.32"

sha2 = "0.10"
url = "2.5"
tempfile = "3.20"
clap = { version = "4.5", features = ["derive"] }
# Perimeter Invariant Validation
validator = { version = "0.20", features = ["derive"] }

# Testing Infrastructure & Verification Engines
pretty_assertions = "1.4"
insta = { version = "1.40", features = ["json"] }
proptest = "1.5"
serial_test = "3.5"

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
unexpected_cfgs = "deny"
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_imports = "warn"
unused_lifetimes = "deny"
unused_must_use = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -3 }
pedantic = { level = "warn", priority = -2 }
nursery = { level = "warn", priority = -2 }

unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
debug = true
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = true

[profile.test]
debug = true
