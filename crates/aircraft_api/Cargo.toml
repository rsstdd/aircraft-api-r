[package]
name = "aircraft_api"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Internal Workspace Layers (Driving the Use-Cases)
aircraft_domain.workspace = true
aircraft_app.workspace = true

# Asynchronous HTTP Transport Core
axum.workspace = true
futures.workspace = true
tower.workspace = true
# `sync` only: the shutdown state needs a notifier to end in-flight requests
# with, and nothing here drives a runtime.
tokio = { workspace = true, features = ["sync"] }
tower-http = { workspace = true, features = ["limit", "trace", "cors"] }

# Data Input Boundary Validation & Serialization
serde.workspace = true
serde_json.workspace = true

# OpenAPI Specification / Documentation Generation
utoipa = { workspace = true, features = ["axum_extras", "chrono", "uuid"] }

# Error Management & Diagnostic Spans
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Primitive Formats (for DTO mapping)
chrono.workspace = true
uuid.workspace = true

[dev-dependencies]
# The readiness port is implemented by fakes in the router tests.
async-trait.workspace = true
# `tests/request_tracing.rs` reads the per-request event back through a JSON
# subscriber it installs on its own futures; nothing here installs one globally.
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { workspace = true, features = ["util"] }
