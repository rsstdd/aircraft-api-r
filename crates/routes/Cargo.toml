[package]
name = "aircraft_routes"
version = "0.14.1"
edition = "2024"

[lib]
doctest = false

[dependencies]
aircraft_utils = { version = "=0.1.0", path = "../utils" }
aircraft_websocket = { version = "=0.1.0", path = "../websocket" }
aircraft_db_schema = { version = "=0.1.0", path = "../db_schema" }
aircraft_api_common = { version = "=0.1.0", path = "../api_common" }
aircraft_apub = { version = "=0.1.0", path = "../apub" }
diesel = "1.4.8"
actix = "0.12.0"
actix-web = { version = "4.0.0-beta.9", default-features = false, features = ["rustls"] }
actix-web-actors = { version = "4.0.0-beta.7", default-features = false }
actix-http = "3.0.0-beta.10"
sha2 = "0.9.8"
log = "0.4.14"
anyhow = "1.0.44"
chrono = { version = "0.4.19", features = ["serde"] }
rss = "1.10.0"
serde = { version = "1.0.130", features = ["derive"] }
awc = { version = "3.0.0-beta.8", default-features = false }
url = { version = "2.2.2", features = ["serde"] }
strum = "0.21.0"
lazy_static = "1.4.0"
