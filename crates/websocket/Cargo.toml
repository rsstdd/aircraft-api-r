[package]
name = "aircraft_websocket"
version = "0.1.0"
edition = "2018"

[lib]
name = "aircraft_websocket"
path = "src/lib.rs"
doctest = false

[dependencies]
aircraft_utils = { version = "=0.1.0", path = "../utils" }
aircraft_db_schema = { version = "=0.1.0", path = "../db_schema" }
reqwest = { version = "0.11.4", features = ["json"] }
log = "0.4.14"
rand = "0.8.4"
serde = { version = "1.0.130", features = ["derive"] }
serde_json = { version = "1.0.68", features = ["preserve_order"] }
actix = "0.12.0"
anyhow = "1.0.44"
diesel = "1.4.8"
background-jobs = "0.9.1"
tokio = "1.12.0"
strum = "0.21.0"
strum_macros = "0.21.1"
chrono = { version = "0.4.19", features = ["serde"] }
actix-web = { version = "4.0.0-beta.9", default-features = false, features = ["rustls"] }
actix-web-actors = { version = "4.0.0-beta.7", default-features = false }
# aircraft_api_common = { version = "=0.1.0", path = "../api_common" }
# aircraft_db_views = { version = "=0.1.0", path = "../db_views" }
# aircraft_db_views_actor = { version = "=0.1.0", path = "../db_views_actor" }
