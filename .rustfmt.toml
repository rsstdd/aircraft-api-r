# =============================================================================
# Rustfmt
# =============================================================================
# Keep this file compatible with the repository's stable Rust toolchain.
# =============================================================================

edition = "2024"
style_edition = "2024"

max_width = 100
tab_spaces = 2
newline_style = "Unix"

# More compact idiomatic Rust:
#
# Struct initialization:
#   Config { host: host, port: port }
# becomes:
#   Config { host, port }
use_field_init_shorthand = true

# Converts:
#   try!(some_result)
# to:
#   some_result?
use_try_shorthand = true

# Keep rustfmt responsible for deterministic import and module ordering.
reorder_imports = true
reorder_modules = true

# Uses the full width budget more aggressively before wrapping.
use_small_heuristics = "Max"
