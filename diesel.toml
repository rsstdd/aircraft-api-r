# =============================================================================
# Diesel CLI
# =============================================================================
# Diesel 2.3+ schema generation configuration.
#
# This project uses PostgreSQL schema namespaces:
# - aircraft_ref
# - aircraft_geo
# - aircraft_org
# - aircraft_core
# - aircraft_cert
# - aircraft_specs
# - aircraft_power
# - aircraft_systems
# - aircraft_military
# - aircraft_market
# - aircraft_maint
# - aircraft_prov
# - aircraft_compare
# - aircraft_ingest
# - aircraft_read
# =============================================================================


# -----------------------------------------------------------------------------
# Default schema generation target
# -----------------------------------------------------------------------------
# Use the core application schema as the default.
# Additional schemas can be generated via:
#
#   diesel print-schema --schema-key aircraft_ref
#   diesel print-schema --schema-key aircraft_core
#   diesel print-schema --schema-key aircraft_specs
#
# Diesel's `schema` field only affects PostgreSQL. If omitted, Diesel searches
# `public`, which is not correct for this project.
# -----------------------------------------------------------------------------

[print_schema]
file = "src/database/schema/aircraft_core.rs"
schema = "aircraft_core"
with_docs = true
generate_missing_sql_type_definitions = true
custom_type_derives = ["diesel::sql_types::SqlType", "std::fmt::Debug"]
import_types = ["diesel::sql_types::*"]
allow_tables_to_appear_in_same_query_config = "fk_related_tables"
column_sorting = "ordinal_position"


# -----------------------------------------------------------------------------
# Reference / lookup schema
# -----------------------------------------------------------------------------

[print_schema.aircraft_ref]
file = "src/db/schema/aircraft_ref.rs"
schema = "aircraft_ref"
with_docs = true
generate_missing_sql_type_definitions = true
custom_type_derives = ["diesel::sql_types::SqlType", "std::fmt::Debug"]
import_types = ["diesel::sql_types::*"]
allow_tables_to_appear_in_same_query_config = "fk_related_tables"
column_sorting = "ordinal_position"

# PostgreSQL domains from 001_extensions_schemas_domains_triggers.sql.
# Enable this only if application code needs Diesel custom SQL types for these
# domains instead of treating them as their underlying SQL types.
