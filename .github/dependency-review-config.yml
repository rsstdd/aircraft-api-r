fail-on-severity: high
fail-on-scopes:
  - runtime
  - development
  - unknown
allow-licenses:
  - Apache-2.0
  - Apache-2.0 WITH LLVM-exception
  - BSD-3-Clause
  - CDLA-Permissive-2.0
  - BSL-1.0
  - ISC
  - MIT
  - Unicode-3.0
  - Unlicense
  - Zlib
allow-dependencies-licenses:
  - pkg:cargo/r-efi
