[package]
name = "aircraft_server"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "aircraft_server"
path = "src/lib.rs"

[[bin]]
name = "aircraft-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aircraft_api.workspace = true
# The composition root builds the authentication service the router enforces
# scoped routes with, over the credential lookup `aircraft_db` implements.
aircraft_app.workspace = true
aircraft_config.workspace = true
aircraft_db.workspace = true
aircraft_observability.workspace = true

anyhow.workspace = true
axum.workspace = true
secrecy.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# The composition root now builds a pool, so the gates that drive the shipped
# binary need a disposable PostgreSQL to point it at.
aircraft_testsupport.workspace = true

# The drain gates call `serve` in process, so they implement the readiness and
# credential-lookup ports with fakes they control rather than starting a
# container, and read back the warning the expired window emits. `uuid` is the
# lookup port's key type.
async-trait.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
